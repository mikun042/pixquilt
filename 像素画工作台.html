<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素画工作台 · 拼豆图纸与游戏资产</title>
<!--
  单文件交付：构建时会把样式与脚本全部内联进这里（见 tool/build.mjs），
  因此这份 HTML 双击即可用，不需要服务器、不需要 Node、不联网。
-->
<style>/*
 * 工作台样式：Blender 风格深灰工作台 + 像素化图标。
 *
 * 取色原则（未变）：界面颜色必须比画布内容"退后一步"——像素画的颜色判断不能被界面染色干扰。
 * 因此用**中性灰阶**（不带蓝味），强调色只出现在"激活/焦点"上，不大面积铺蓝。
 *
 * 色值来源：这组灰不是拍脑袋定的，是取色器（`.cp`）早就照 **Blender 截图实测**量出来的那套
 * （`#181818` 底 / `#545454` 控件 / `#4772b3` 强调蓝 / `#e6e6e6` 主文字 / `#a7a7a7` 次文字）。
 * 本次重构把它从"取色器局部覆盖"提升为**全站变量**——原先只有取色器是中性灰、
 * 界面其余部分是偏蓝的板岩色（`#14161c` 那一族），两套配色并存看着是两个软件。
 */
:root {
  /* 灰阶：越靠后越亮。面板 < 控件 < 悬停 */
  --bg: #181818;      /* 应用底（Blender 最暗层） */
  --bg-2: #242424;    /* 面板：顶栏 / 侧栏 / 状态栏 */
  --bg-3: #303030;    /* 控件底：按钮 / 输入框 / 工具按钮 */
  --bg-4: #3a3a3a;    /* 悬停：比控件再亮一档 */
  --line: #3a3a3a;    /* 分隔线（低对比，不抢视线） */
  --line-strong: #545454; /* 控件描边（需要看得出边界处） */
  --text: #e6e6e6;
  --dim: #a7a7a7;
  /* 强调：低饱和蓝，只用在与"当前状态"有关的地方（激活/焦点/选中） */
  --accent: #4772b3;
  --accent-2: #5a86c9;
  --warn: #f0b232;
  --error: #f26d6d;
  /*
   * 圆角刻意收小到 2–3px：像素化图标是方块边缘，嵌在大圆角控件里会"打架"
   * （像素方图标 + 6px 圆角按钮 = 两种视觉语言）。Blender 本身也是接近直角的。
   */
  --radius: 2px;
  --radius-lg: 3px;
  /*
   * 三栏宽度。折叠态要保留"另一侧"的原宽，所以用变量而不是把像素重复写死
   * （1200px 断点只改这两个值，收敛在一处）。
   */
  --rail-w: 232px;
  --panel-w: 300px;
  --font: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Noto Sans Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  overflow: hidden;
}

.app { display: flex; flex-direction: column; height: 100vh; }

/* ------------------------------------------------------------------ 顶栏 */

/*
 * 顶栏分两组：左侧只有"当前处于什么状态"（品牌 + 模式切换），右侧是全部动作按钮。
 * 依据是桌面软件的肌肉记忆：动作集中在右上角，状态留在左边。
 */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  flex-wrap: wrap;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
  min-width: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-left: auto;
}

.logo { font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* 动作按钮：图标 + 文字，窄屏自动只剩图标（title/aria-label 保证仍可辨识） */
.act .act-icon { font-size: 13px; line-height: 1; }
.act .act-label { margin-left: 4px; }

/* 最右侧的独立入口（快捷键速查）：与其它按钮拉开距离，降低误触 */
.btn.edge { margin-left: 8px; }
.btn.edge::before {
  content: '';
  display: inline-block;
  width: 1px;
  height: 18px;
  margin-right: 8px;
  vertical-align: middle;
  background: var(--line);
}

/* ------------------------------------------------------------------ 导出下拉菜单 */

.menu-anchor { position: relative; display: inline-flex; }

.dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 80;
  min-width: 268px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--bg-3);
  box-shadow: 0 12px 32px #000a;
}
.dropdown[hidden] { display: none; }

.dropdown-group {
  padding: 6px 8px 3px;
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--dim);
}

.dropdown-item {
  display: flex;
  flex-direction: column;
  gap: 1px;
  width: 100%;
  padding: 6px 8px;
  font: inherit;
  text-align: left;
  color: var(--text);
  background: none;
  border: 0;
  border-radius: var(--radius-lg);
  cursor: pointer;
}
.dropdown-item:hover:not(:disabled) { background: var(--bg-4); }
.dropdown-item:disabled { opacity: 0.4; cursor: not-allowed; }
.dropdown-item .di-label { font-size: 13px; }
.dropdown-item .di-hint { font-size: 11px; color: var(--dim); }

.dropdown-row {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-wrap: wrap;
  padding: 5px 8px 7px;
}
.dropdown-row-label { font-size: 11px; color: var(--dim); margin-right: 2px; }

.dropdown-empty {
  padding: 8px;
  font-size: 12px;
  color: var(--warn);
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}

/* 没有画布时导出按钮仍可点开（菜单里会说明原因），只做视觉弱化 */
.btn.is-empty { opacity: 0.75; }

/* ------------------------------------------------------------------ 三区布局 */

.main {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr var(--panel-w);
  flex: 1;
  min-height: 0;
}

/*
 * 两侧栏都是"可滚动内容"的纵向 flex。折叠开关**不在栏内**（浮在栏外的画布边上，
 * 见下面的 `.rail-toggle`），所以面板收起时可以直接 `display:none`，开关不会跟着消失。
 *
 * ⚠️ `min-height: 0` + `overflow: hidden` 不能省：grid/flex 子项的自动最小高度是
 * **内容高度**，不压住的话面板会撑到跟内容一样高、整个页面跟着变长——表现就是
 * "面板里的滚动条拖不动/滚不动，滚动条跑到页面上去了"（改用 `.rail-body` 做滚动容器时踩过）。
 */
.rail,
.right {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--bg-2);
}
.rail { border-right: 1px solid var(--line); }
.right { border-left: 1px solid var(--line); }
.rail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; }
.center { display: flex; flex-direction: column; min-width: 0; }

.canvas-host {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%, #222222 0%, #161616 100%);
}

#board { display: block; cursor: crosshair; touch-action: none; }

.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--dim);
  pointer-events: none;
  text-align: center;
}
.empty-icon { font-size: 46px; opacity: 0.35; }
.empty-title { font-size: 15px; }
.empty-hint { font-size: 12px; opacity: 0.75; }
/*
 * 空状态里的操作按钮。`.empty-state` 整层是 `pointer-events: none`（避免它挡住画布交互），
 * 所以按钮必须显式恢复指针事件，否则"看得见、点不动"。
 */
.empty-actions { display: flex; gap: 8px; margin: 10px 0 4px; pointer-events: auto; }
.empty-actions .btn { pointer-events: auto; }

.magnifier {
  position: absolute;
  top: 0;
  left: 0;
  display: none;
  padding: 4px;
  border-radius: var(--radius);
  background: rgba(24, 24, 24, 0.94);
  border: 1px solid var(--line);
  pointer-events: none;
}
.magnifier canvas { display: block; image-rendering: pixelated; }
.mag-label { font-size: 10px; color: var(--dim); text-align: center; }

.statusbar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 5px 12px;
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--dim);
  font-family: var(--mono);
  font-size: 11px;
  white-space: nowrap;
  overflow-x: auto;
}

/* ------------------------------------------------------------------ 控件 */

.btn {
  font: inherit;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--line-strong); background: var(--bg-4); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.active { border-color: var(--accent); color: var(--accent); }
/* 按压反馈：全站此前没有 :active 样式（只有 hover），点下去没有"按到了"的手感。
   不位移、不做动画，只压暗一档背景——与这套"无动效"的工具风格一致。 */
.btn:active:not(:disabled) { background: var(--bg-2); border-color: var(--accent); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn.tiny { padding: 3px 7px; font-size: 11px; font-family: var(--mono); }

/*
 * 预设 chip：点一个套一套参数。
 * 用 3 列网格而不是 `.row` 的换行流水布局——预设名长短不一，自由换行会参差不齐；
 * 网格让每一列对齐（与左侧工具按钮的网格同一观感）。选择器带 `#panel-params` 是为了
 * 盖过文件后面 `.row` 的 `display: flex`（同权重时后写的赢，位置一动就会静默失效）。
 *  · 自定义预设（.custom）虚线与 ★ 前缀区分；
 *  · 被用户改过的出厂预设（.modified）带一个圆点角标；
 *  · 当前参数正好等于某个预设时给它 .active（参数深比较见 presets.ts 的 sameParams）。
 */
#panel-params .preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 2px; }
.preset-chip { overflow-wrap: anywhere; }
.preset-chip.custom { border-style: dashed; }
.preset-chip.modified::after {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-left: 5px;
  border-radius: 50%;
  background: var(--accent);
  vertical-align: 1px;
}
.preset-bar { gap: 4px; margin-top: 4px; }
.preset-editor { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.preset-line { display: flex; align-items: center; gap: 4px; font-size: 11px; }
.preset-line-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--dim);
}

select, input[type="number"], input[type="text"], .num {
  font: inherit;
  font-family: var(--mono);
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 3px 6px;
}
.num { width: 68px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.panel { margin-bottom: 14px; }
.panel-title {
  font-size: 11px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  margin: 10px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
}

/*
 * 可折叠分组（右侧参数面板）。
 *
 * 标题做成**整行可点**的按钮（Blender 的 Properties 就是这个手感：点标题栏收起/展开），
 * 而不是只点那个小三角——小三角命中区太小，是"点了没反应"的常见来源。
 *
 * 层次靠「背景色差 + 三角 + 间距」建立，不靠边框与大圆角：
 * 标题条用比面板略亮的底色；展开时三角朝下、收起时朝右。
 */
.panel-section { margin-bottom: 10px; }
.panel-head {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 5px 6px;
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.7px;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
}
.panel-head:hover { background: var(--bg-4); }
.panel-head:active { background: var(--bg-2); }
.panel-head.collapsed { color: var(--dim); }
/* 三角占固定宽度：收起/展开时标题文字不会左右跳动 */
.panel-caret { width: 10px; flex: none; color: var(--dim); }
.panel-head-title { flex: 1; }
.panel-body { padding: 8px 2px 0; }
.panel-body > .field:last-child { margin-bottom: 0; }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
.field > label { color: var(--dim); font-size: 12px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.row.wrap { flex-wrap: wrap; }
.field-inner { margin: 4px 0 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.hint { color: var(--dim); font-size: 11px; line-height: 1.5; }
.hint.lines { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }

/* ------------------------------------------------------------------ 工具栏 */

.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
.tool-btn {
  font: inherit;
  font-size: 12px;
  padding: 7px 4px;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
}
.tool-btn:hover { border-color: var(--line-strong); background: var(--bg-4); }
.tool-btn:active { background: var(--bg-2); }
.tool-btn.active { border-color: var(--accent); background: var(--bg-4); color: #e6e6e6; }

.color-row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
.color-slot {
  display: flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 4px 6px;
  cursor: pointer;
}
.color-slot .chip { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #00000055; }
.color-slot .chip-label { font-size: 11px; color: var(--dim); }

/*
 * 「合成底色」的色块按钮：点它在字段下方**就地展开**取色盘（实现在 `src/app/matte-field.ts` 的
 * `createMatteField()` 里——该字段原先是 index.ts 的 `renderMattePicker()`，2026-09-14 抽成工厂）。
 * 它复用了 `.color-slot .chip` 的色块外观，因此这里只安排内部排布——
 * 万一以后 .chip 那条选择器改了，这里不用跟着动。
 */
.color-pick { display: inline-flex; align-items: center; gap: 6px; }
.color-pick .chip { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #00000055; }
.color-pick .color-pick-hex { font-family: var(--mono); font-size: 11px; color: var(--dim); }
/* 展开状态：色块加一圈强调边，让"调色盘正开着"这件事在字段本身就能看出来 */
.color-pick.active { border-color: var(--accent); }

/* ------------------------------------------------------------------ 色板 */

.swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; }
.swatch {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid #00000066;
  border-radius: 3px;
  cursor: pointer;
  padding: 0;
}
.swatch.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
.swatch.unused { opacity: 0.35; }
.swatch .count {
  position: absolute;
  right: 1px;
  bottom: 0;
  font-family: var(--mono);
  font-size: 9px;
  line-height: 1;
  text-shadow: 0 0 2px #000;
}
.swatch.transparent {
  background: repeating-conic-gradient(#4a4a4a 0 25%, #383838 0 50%) 0 0 / 8px 8px;
  color: #e6e6e6;
}

.picker-wrap { margin-top: 8px; }
/*
 * 就地展开的取色器宿主（合成底色用，挂在参数面板里它那个字段下面）。
 * 只额外要一点上边距把"字段 → 调色盘"分开；宽度跟着面板走（`.cp` 自己是定宽的）。
 */
.picker-wrap.inline { margin: 6px 0 10px 8px; }

/* ------------------------------------------------------------------ 取色器（Blender 结构） */

/*
 * 参考图实测配色：#181818 底 / #545454 控件底 / #4772b3 强调蓝 / #e6e6e6 主文字 / #a7a7a7 次文字。
 *
 * 2026-09-15 起这套灰**已提升为全站变量**（见文件顶部 `:root`）——原先它只在本作用域覆盖
 * （`--line/--text/--dim`），于是"取色器是中性灰、界面其余是偏蓝板岩色"两套配色并存。
 * 现在这里只留取色器**独有**的 `--cp-*`（滑条槽/填充/输入框底这些概念只它用得上），
 * `--line/--text/--dim` 不再重复声明、直接继承 `:root`——少一处重复就少一次"改一半"的机会。
 *
 * 尺寸：.cp 内容宽 176 = 色轮 156 + 间隙 6 + 明度条 14 —— 正好填满，不溢出。
 */
.cp {
  --cp-bg: #181818;      /* 面板底 + 行间分隔线 */
  --cp-slot: #545454;    /* 滑条未填充槽 / 未激活标签 */
  --cp-fill: #4772b3;    /* 滑条填充 / 激活标签 */
  --cp-field: #1d1d1d;   /* Hex 输入框底 */
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--cp-bg);
  /*
   * 拖滑条时不要选中沿途文字：鼠标按住扫过色轮/滑条会让浏览器把经过的标签、数字
   * 一并划进选区（`touch-action` 只挡触摸滚动，挡不住鼠标选词），观感很脏。
   * 输入框在下面单独恢复 user-select:text，否则数字框里没法拖选替换。
   */
  user-select: none;
}

/* 顶部色彩模型标签：两个分段共用一个圆角容器，无缝隙、各占一半（参考图实测） */
.cp-tabs {
  display: flex;
  height: 26px;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--cp-slot);
}
.cp-tab {
  flex: 1;
  font: inherit;
  font-size: 12px;
  color: var(--text);
  background: none;
  border: 0;
  cursor: pointer;
  text-shadow: 0 1px 0 #00000066;
}
.cp-tab:hover { color: #fff; }
.cp-tab.active { background: var(--cp-fill); color: #fff; }

/* 色轮 + 右侧明度竖条 */
.cp-wheel-row { display: flex; align-items: flex-start; }
.cp-wheel-wrap { position: relative; flex: none; }
.cp-wheel { display: block; border-radius: 50%; cursor: crosshair; touch-action: none; }

/* 游标：细圈（参考图直径≈轮径 8%、描边约 1.5px、无中心点），浅色 + 极淡暗描边保证亮底上也看得见 */
.cp-cursor {
  position: absolute;
  top: 0;
  left: 0;
  width: 13px;
  height: 13px;
  border: 1.5px solid #dcdcdc;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #00000045;
  pointer-events: none;
}

.cp-bar-wrap { position: relative; cursor: ns-resize; touch-action: none; }
.cp-bar { display: block; }
/*
 * 明度滑块：参考图实测是"悬出条宽"的浅色方块（内芯约 9px + 浅描边），
 * 上下各留 ~1.5px 深色分隔。用 box-shadow 画上下两条深色带，不需要额外 DOM。
 */
.cp-vknob {
  position: absolute;
  left: -2px;
  right: -2px;
  height: 10px;
  margin-top: -5px;
  background: #ffffff2e;
  border: 1px solid #e6e6e6;
  border-radius: 1px;
  box-shadow: 0 -2px 0 var(--cp-bg), 0 2px 0 var(--cp-bg);
  pointer-events: none;
}

/* Hex 行右侧的吸管按钮（参考图是 27×27 的 #545454 方块） */
.cp-icon-btn {
  width: 27px;
  height: 27px;
  flex: none;
  font: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--cp-slot);
  border: 0;
  border-radius: 3px;
  cursor: pointer;
}
.cp-icon-btn:hover { background: var(--cp-fill); color: #fff; }

/*
 * 内联 SVG 图标（见 src/app/ui/icons.ts）。
 * 尺寸由 CSS 定，**不写元素上的 width/height 属性**——写死了以后改样式不生效，
 * 是最容易白费一轮的一类坑。`currentColor` 让图标跟着文字色走，
 * 悬停/激活态自动变色，不必为每个状态各写一份。
 */
.icon-svg {
  width: 17px;
  height: 17px;
  display: block;
  flex: none;
}
/*
 * 工具按钮里的图标必须**跟文字同一行、在文字左边**——要和旁边"矩形 / 椭圆 / 选区"
 * 那些用字符图标的按钮排成一样的形状。
 *
 * `.icon-svg` 默认 `display:block`（取色器 Hex 行那颗按钮需要它独占一格，不与输入框抢基线），
 * 但在工具按钮里 block 会把"取色"两个字挤到下一行，那一格就变成两行、与同排的"矩形"对不齐。
 * 这里改回 inline-block；`vertical-align: middle` 让 14px 的图标与 12px 的文字光学居中
 * （用默认的 baseline 对齐会让图标明显偏高）。
 */
.tool-btn .icon-svg {
  /*
   * 16px（原 14px）：像素图标是方块边缘，**偶数尺寸**才能让像素格落在整数边界上。
   * 14px 时 32 格图标每格 0.44px、16 格每格 0.875px，边缘都会糊出灰边。
   * 注意 e2e-pdf 有一条"图标尺寸 > 8px"的断言，改小会红。
   */
  width: 16px;
  height: 16px;
  display: inline-block;
  vertical-align: middle;
}

/* 顶栏动作图标：与文字并排，尺寸与工具图标一致（避免同一界面出现两种像素密度） */
.act .icon-svg {
  width: 16px;
  height: 16px;
  display: inline-block;
  vertical-align: -3px;
}

/*
 * Alpha 行的滑条轨道：未填充槽用棋盘格——本工具的 alpha 是"透明色"开关，
 * 0.000 时能一眼看出是透明；1.000 时填充全蓝，与参考图一致。
 */
.cp-alpha .cp-row-track {
  background: repeating-conic-gradient(#4a4a4a 0 25%, #383838 0 50%) 0 0 / 8px 8px;
}

/*
 * 数值行 = **[滑条轨道][数值框]**，数值框在轨道之外（结构隔离，见 colorpicker.ts 注释）。
 * 行底色用面板色：轨道才是"滑条"，右边那块是放数字的地方。
 * 行高 27px、上下各留 1px，于是相邻两条轨道之间有 2px 深色分隔（不需要分隔线）。
 */
.cp-fields { display: flex; flex-direction: column; }
.cp-row {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 27px;
  padding: 1px 0;
  background: var(--cp-bg);
}
/* 轨道：拖动命中区 + 填充的裁剪容器。拖动基准是轨道本身，填充画在轨道里。
   touch-action:none 才有触摸拖动；cursor 只在轨道上给 ew-resize（数值框上是文本光标） */
.cp-row-track {
  position: relative;
  flex: 1;
  min-width: 0;
  align-self: stretch;
  border-radius: 2px;
  overflow: hidden;
  background: var(--cp-slot);
  cursor: ew-resize;
  touch-action: none;
}
/* 蓝色填充层：宽度 = 数值占满量的比例（0.800 → 80%），由 paintFields() 写入 */
.cp-row-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0;
  background: var(--cp-fill);
}
/* 标签浮在填充层之上；pointer-events:none 让指针事件的 target 就是轨道本身 */
.cp-row-label {
  position: relative;
  display: block;
  padding-left: 8px;
  line-height: 25px;
  font-size: 12px;
  color: var(--text);
  text-shadow: 0 1px 0 #00000066;
  pointer-events: none;
}
/* 数值输入：必须盖掉全局 input 样式（271 行那条 input[type="text"] 选择器特异性比单个类高，
   所以这里写成 .cp-row .cp-num） */
.cp-row .cp-num,
.cp-hexrow .cp-num {
  font: inherit;
  font-family: var(--font);
  font-size: 12px;
  color: var(--text);
  background: none;
  border: 0;
  border-radius: 0;
  outline: none;
  /* 取色器整体禁选（见 .cp），但输入框必须能选中自己的内容，否则没法拖选替换 */
  user-select: text;
}
.cp-row .cp-num {
  flex: none;
  width: 42px;
  padding: 0 3px 0 0;
  text-align: right;
  cursor: text;
}
.cp-row .cp-num:focus,
.cp-hexrow .cp-num:focus { color: #fff; }

/* Hex 行（常驻）：灰标签 + 深色输入框 + 吸管按钮 */
.cp-hexrow { display: flex; align-items: center; gap: 6px; }
.cp-hex-label { font-size: 12px; color: var(--dim); }
.cp-hexrow .cp-num {
  flex: 1;
  width: auto;
  min-width: 0;
  height: 27px;
  padding: 0 8px;
  text-align: left;
  font-family: var(--mono);
  background: var(--cp-field);
  border: 1px solid var(--line);
  border-radius: 3px;
}

/* 色板 */
.cp-swatches { display: flex; flex-direction: column; gap: 5px; }
.cp-swatch-row { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.cp-swatch-name { width: 34px; flex: none; font-size: 10px; color: var(--dim); }
.cp-swatch {
  width: 16px;
  height: 16px;
  padding: 0;
  border: 1px solid #00000066;
  border-radius: 3px;
  cursor: pointer;
}
.cp-swatch:hover { outline: 2px solid var(--accent); outline-offset: -1px; }
.cp-swatch.transparent {
  width: 24px;
  background: repeating-conic-gradient(#4a4a4a 0 25%, #383838 0 50%) 0 0 / 8px 8px;
  color: #e6e6e6;
  font-size: 11px;
  line-height: 14px;
}
.cp-swatch.transparent.active { outline: 2px solid var(--accent); outline-offset: -1px; }

.cp-foot { display: flex; justify-content: flex-end; }

/* ------------------------------------------------------------------ 提示与模态 */

.toast-stack {
  position: fixed;
  right: 14px;
  bottom: 34px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 90;
}
.toast {
  padding: 7px 11px;
  border-radius: var(--radius);
  background: var(--bg-3);
  border: 1px solid var(--line);
  box-shadow: 0 4px 16px #0008;
  max-width: 340px;
  font-size: 12px;
}
.toast.warn { border-color: var(--warn); }
.toast.error { border-color: var(--error); }

.modal-mask {
  position: fixed;
  inset: 0;
  background: #00000099;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 120;
}
.modal {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  max-width: 620px;
  max-height: 80vh;
  overflow: auto;
  box-shadow: 0 12px 40px #000a;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
.modal table { border-collapse: collapse; width: 100%; }
.modal td { padding: 3px 8px 3px 0; vertical-align: top; }
.modal td:first-child { font-family: var(--mono); color: var(--accent); white-space: nowrap; }
.modal td:last-child { color: var(--text); }

/* ------------------------------------------------------------------ 响应式 */

@media (max-width: 1200px) {
  :root { --rail-w: 200px; --panel-w: 260px; }
  /* 保证右上角的动作按钮不与左侧品牌抢空间：编辑类按钮先收成图标 */
  .act .act-label { display: none; }
  .act { padding: 5px 8px; }
}
@media (max-width: 980px) {
  .main { grid-template-columns: 1fr; }
  /*
   * 窄屏：侧栏收成浮层抽屉（浮在画布之上）。
   * 开合由栏外的 `.rail-toggle` 驱动，所以收起时可以直接 `display:none`——
   * 开关浮在画布边上，不会跟着面板一起消失。
   */
  .rail,
  .right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: min(300px, 88vw);
    z-index: 80;
    box-shadow: 0 0 32px #000a;
    display: none;
  }
  .rail { left: 0; }
  .right { right: 0; }
  body.drawer-open .rail,
  body.drawer-open .right { display: flex; }
  body.no-rail .rail,
  body.no-panel .right { display: none; }
  /* 抽屉打开时用遮罩挡住画布，点遮罩关闭——避免"看起来还能点画布" */
  body.drawer-open .drawer-scrim { display: block; }
}

/*
 * 桌面宽度下折叠侧栏：开关浮在栏外（画布区贴栏的那条边），所以收起可以**整栏隐藏**。
 *
 * ⚠️ 隐藏一栏时**必须同时把模板改成两列**：`display:none` 会把那个 grid 项从布局流里
 * 摘掉，剩下两项会被自动重排到前两列——三列模板下表现为"画布宽度变成 0、另一栏却占满了"。
 * 所以这里不能只改 `display`，模板要跟着变（下面三条就是三种组合）。
 */
@media (min-width: 981px) {
  body.no-rail .main { grid-template-columns: 1fr var(--panel-w); }
  body.no-panel .main { grid-template-columns: var(--rail-w) 1fr; }
  /*
   * 两边同时收起。这条必须比上面两条更"重"才有确定的胜负：
   * 早期写成同权重的 `body.no-rail.no-panel .main`，靠源码顺序取胜——
   * 顺序一变就静默失配（两栏都隐藏了、网格却还留着空列）。
   * 加 `.main` 提高一级特异性，就不再看顺序。
   */
  body.no-rail.no-panel .main.main { grid-template-columns: 1fr; }
  body.no-rail .rail,
  body.no-panel .right { display: none; }
}

/*
 * 折叠 / 展开开关：浮在**侧栏外面**——画布区紧贴侧栏的那条边、顶端
 * （左栏开关在画布左上角，右栏开关在画布右上角）。
 *
 * 图标是**三角形箭头**，指向"点下去会往哪收"：展开时指向收纳方向（左栏 ◀ / 右栏 ▶），
 * 收起后指向展开方向（左栏 ▶ / 右栏 ◀）。方向由 index.ts 写进来（见 updateRailToggle）。
 *
 * 为什么放栏外而不是栏内：栏内的话，面板一 `display:none` 开关就跟着没了，
 * 只能让面板收成一条窄边来"顺便"留住开关（那一版还会让空窄边白占宽度）。
 * 浮在栏外就没有这个约束：面板可以真正收干净，开关永远在原地。
 */
.rail-toggle {
  position: absolute;
  top: 6px;
  z-index: 30;
  width: 20px;
  height: 18px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  line-height: 1;
  color: var(--dim);
  background: rgba(24, 24, 24, 0.78);
  border: 1px solid var(--line);
  border-radius: 3px;
  cursor: pointer;
}
#btn-drawer-tools { left: 6px; }
#btn-drawer-panel { right: 6px; }
.rail-toggle:hover { color: var(--text); background: var(--bg-3); border-color: var(--accent-2); }
.rail-toggle:active { background: var(--bg-2); }

/* 窄屏抽屉遮罩（桌面宽度下不产生可见效果） */
.drawer-scrim {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: #00000066;
  display: none;
}
.drawer-scrim[hidden] { display: none; }
@media (max-width: 720px) {
  .header { padding: 6px 8px; gap: 6px; }
  .header-left { gap: 6px; }
  .logo { font-size: 12px; }
  .header-actions { gap: 4px; }
  .dropdown { min-width: 240px; right: -4px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <!--
      顶栏分两组：
        左侧 = 品牌（工作模式选择器已移除，三种用途并入右侧「预设」）
        右侧 = 其余全部操作：撤销 / 重做 / 重新转换 / 新建 / 导入 / 导出，最右侧是「? 快捷键」
      依据是桌面软件的肌肉记忆：动作按钮集中在右上角，左侧只放"当前处于什么状态"；
      帮助类入口放在最边缘（离其它按钮远一点，避免误触）。
      窄屏（≤980px）时侧栏被收成抽屉，因此最左边会出现「工具」「参数」两个开关按钮。
    -->
    <div class="header-left">
      <div class="logo">▦ 像素画工作台</div>
    </div>
    <div class="header-right">
      <div class="header-actions" id="header-actions"></div>
      <button class="btn" id="btn-import" type="button"></button>
      <div class="menu-anchor" id="export-anchor">
        <button class="btn primary" id="btn-export" type="button" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="dropdown" id="export-menu" role="menu" hidden></div>
      </div>
      <button class="btn act edge" id="btn-help" type="button"></button>
    </div>
  </header>

  <div class="main">
    <aside class="rail" id="rail-left">
      <div class="rail-body">
        <div id="rail-tools"></div>
        <div class="panel" id="panel-palette"></div>
      </div>
    </aside>

    <section class="center">
      <div class="canvas-host" id="canvas-host">
        <canvas id="board"></canvas>
        <!--
          空状态提示**不写死在模板里**：它由 UI 在"没有画布"时才插入、一旦有画布就移除。
          写死会导致它一直盖在画好的画布上——表现为"导入图片没反应"（曾真实发生）。
        -->
        <div class="magnifier" id="magnifier">
          <canvas id="magnifier-canvas" width="116" height="116"></canvas>
          <div class="mag-label">原图对照</div>
        </div>
        <!--
          侧栏的折叠/展开开关**浮在栏外**——画布区紧贴侧栏的那条边、顶端
          （左栏开关在画布左上角，右栏开关在画布右上角）。
          栏内长开关的话，面板一 display:none 开关就跟着没了，只能让面板收成窄边；
          浮在栏外则面板可以真正收干净，开关永远在原地。图标是三角形箭头，
          展开时指向收纳方向、收起后指向展开方向。
        -->
        <button class="btn rail-toggle" id="btn-drawer-tools" type="button"></button>
        <button class="btn rail-toggle" id="btn-drawer-panel" type="button"></button>
      </div>
      <footer class="statusbar" id="statusbar"></footer>
    </section>

    <aside class="right" id="rail-right">
      <div class="rail-body">
        <div class="panel" id="panel-params"></div>
      </div>
    </aside>
  </div>
  <!-- 窄屏抽屉遮罩：点它关闭抽屉（桌面宽度下不显示） -->
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
</div>
