<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素画工作台 · 拼豆图纸与游戏资产</title>
<!--
  单文件交付：构建时会把样式与脚本全部内联进这里（见 tool/build.mjs），
  因此这份 HTML 双击即可用，不需要服务器、不需要 Node、不联网。
-->
<style>/*
 * 工作台样式：深色界面 + 中性灰画布底。
 * 取色原则：界面颜色必须比画布内容"退后一步"——像素画的颜色判断不能被界面染色干扰，
 * 因此除了少量强调色，其余全部用中性灰阶，且不引入任何外部字体/图片（离线可用）。
 */
:root {
  --bg: #14161c;
  --bg-2: #1b1e26;
  --bg-3: #232733;
  --line: #2f3442;
  --text: #e8eaf0;
  --dim: #99a0b0;
  --accent: #6ea8fe;
  --accent-2: #4d7fd6;
  --warn: #f0b232;
  --error: #f26d6d;
  --radius: 6px;
  --font: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Noto Sans Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  overflow: hidden;
}

.app { display: flex; flex-direction: column; height: 100vh; }

/* ------------------------------------------------------------------ 顶栏 */

/*
 * 顶栏分两组：左侧只有"当前处于什么状态"（品牌 + 模式切换），右侧是全部动作按钮。
 * 依据是桌面软件的肌肉记忆：动作集中在右上角，状态留在左边。
 */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  flex-wrap: wrap;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
  min-width: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-left: auto;
}

.header-mode { display: flex; align-items: center; }

.logo { font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* 动作按钮：图标 + 文字，窄屏自动只剩图标（title/aria-label 保证仍可辨识） */
.act .act-icon { font-size: 13px; line-height: 1; }
.act .act-label { margin-left: 4px; }

/* 最右侧的独立入口（快捷键速查）：与其它按钮拉开距离，降低误触 */
.btn.edge { margin-left: 8px; }
.btn.edge::before {
  content: '';
  display: inline-block;
  width: 1px;
  height: 18px;
  margin-right: 8px;
  vertical-align: middle;
  background: var(--line);
}

/* ------------------------------------------------------------------ 导出下拉菜单 */

.menu-anchor { position: relative; display: inline-flex; }

.dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 80;
  min-width: 268px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #1e222c;
  box-shadow: 0 12px 32px #000a;
}
.dropdown[hidden] { display: none; }

.dropdown-group {
  padding: 6px 8px 3px;
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--dim);
}

.dropdown-item {
  display: flex;
  flex-direction: column;
  gap: 1px;
  width: 100%;
  padding: 6px 8px;
  font: inherit;
  text-align: left;
  color: var(--text);
  background: none;
  border: 0;
  border-radius: 5px;
  cursor: pointer;
}
.dropdown-item:hover:not(:disabled) { background: #2a3040; }
.dropdown-item:disabled { opacity: 0.4; cursor: not-allowed; }
.dropdown-item .di-label { font-size: 13px; }
.dropdown-item .di-hint { font-size: 11px; color: var(--dim); }

.dropdown-row {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-wrap: wrap;
  padding: 5px 8px 7px;
}
.dropdown-row-label { font-size: 11px; color: var(--dim); margin-right: 2px; }

.dropdown-empty {
  padding: 8px;
  font-size: 12px;
  color: var(--warn);
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}

/* 没有画布时导出按钮仍可点开（菜单里会说明原因），只做视觉弱化 */
.btn.is-empty { opacity: 0.75; }

/* ------------------------------------------------------------------ 三区布局 */

.main {
  display: grid;
  grid-template-columns: 232px 1fr 300px;
  flex: 1;
  min-height: 0;
}

.rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; background: var(--bg-2); }
.right { border-left: 1px solid var(--line); overflow-y: auto; padding: 10px; background: var(--bg-2); }
.center { display: flex; flex-direction: column; min-width: 0; }

.canvas-host {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%, #1c2029 0%, #15171d 100%);
}

#board { display: block; cursor: crosshair; touch-action: none; }

.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--dim);
  pointer-events: none;
  text-align: center;
}
.empty-icon { font-size: 46px; opacity: 0.35; }
.empty-title { font-size: 15px; }
.empty-hint { font-size: 12px; opacity: 0.75; }

/* 画布右下角视图浮层：给鼠标用户可见的缩放入口（键盘 +/-/0 之外） */
.view-toolbar {
  position: absolute;
  right: 10px;
  bottom: 10px;
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: var(--radius);
  background: rgba(20, 22, 28, 0.82);
  border: 1px solid var(--line);
  backdrop-filter: blur(4px);
}

.magnifier {
  position: absolute;
  top: 0;
  left: 0;
  display: none;
  padding: 4px;
  border-radius: var(--radius);
  background: rgba(20, 22, 28, 0.92);
  border: 1px solid var(--line);
  pointer-events: none;
}
.magnifier canvas { display: block; image-rendering: pixelated; }
.mag-label { font-size: 10px; color: var(--dim); text-align: center; }

.statusbar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 5px 12px;
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--dim);
  font-family: var(--mono);
  font-size: 11px;
  white-space: nowrap;
  overflow-x: auto;
}

/* ------------------------------------------------------------------ 控件 */

.btn {
  font: inherit;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: #3d4356; background: #282d3a; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.active { border-color: var(--accent); color: var(--accent); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn.tiny { padding: 3px 7px; font-size: 11px; font-family: var(--mono); }

.mode-select {
  font: inherit;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--accent-2);
  border-radius: var(--radius);
  padding: 5px 8px;
  cursor: pointer;
}

select, input[type="number"], input[type="text"], .num {
  font: inherit;
  font-family: var(--mono);
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 3px 6px;
}
.num { width: 68px; }
input[type="color"] {
  width: 34px;
  height: 24px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: none;
  cursor: pointer;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.panel { margin-bottom: 14px; }
.panel-title {
  font-size: 11px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  margin: 10px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
}
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
.field > label { color: var(--dim); font-size: 12px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.row.wrap { flex-wrap: wrap; }
.field-inner { margin: 4px 0 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.hint { color: var(--dim); font-size: 11px; line-height: 1.5; }
.hint.lines { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }

/* ------------------------------------------------------------------ 工具栏 */

.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
.tool-btn {
  font: inherit;
  font-size: 12px;
  padding: 7px 4px;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
}
.tool-btn:hover { border-color: #3d4356; }
.tool-btn.active { border-color: var(--accent); background: #22304a; color: var(--accent); }

.color-row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
.color-slot {
  display: flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  color: var(--text);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 4px 6px;
  cursor: pointer;
}
.color-slot .chip { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #00000055; }
.color-slot .chip-label { font-size: 11px; color: var(--dim); }

/* ------------------------------------------------------------------ 色板 */

.swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; }
.swatch {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid #00000066;
  border-radius: 3px;
  cursor: pointer;
  padding: 0;
}
.swatch.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
.swatch.unused { opacity: 0.35; }
.swatch .count {
  position: absolute;
  right: 1px;
  bottom: 0;
  font-family: var(--mono);
  font-size: 9px;
  line-height: 1;
  text-shadow: 0 0 2px #000;
}
.swatch.transparent {
  background: repeating-conic-gradient(#3a3d47 0 25%, #2c2f38 0 50%) 0 0 / 8px 8px;
  color: #d8dbe4;
}

.picker-wrap { margin-top: 8px; }

/* ------------------------------------------------------------------ 取色器（Blender 结构） */

/*
 * 参考图实测配色：#181818 底 / #545454 控件底 / #4772b3 强调蓝 / #e6e6e6 主文字 / #a7a7a7 次文字。
 * 这些只在本作用域内覆盖变量（下面 .cp 里的 --line/--text/--dim），不会外溢到界面其它区域。
 * 尺寸：.cp 内容宽 176 = 色轮 156 + 间隙 6 + 明度条 14 —— 正好填满，不溢出。
 */
.cp {
  --cp-bg: #181818;      /* 面板底 + 行间分隔线 */
  --cp-slot: #545454;    /* 滑条未填充槽 / 未激活标签 */
  --cp-fill: #4772b3;    /* 滑条填充 / 激活标签 */
  --cp-field: #1d1d1d;   /* Hex 输入框底 */
  --line: #545454;
  --text: #e6e6e6;
  --dim: #a7a7a7;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--cp-bg);
  /*
   * 拖滑条时不要选中沿途文字：鼠标按住扫过色轮/滑条会让浏览器把经过的标签、数字
   * 一并划进选区（`touch-action` 只挡触摸滚动，挡不住鼠标选词），观感很脏。
   * 输入框在下面单独恢复 user-select:text，否则数字框里没法拖选替换。
   */
  user-select: none;
}

/* 顶部色彩模型标签：两个分段共用一个圆角容器，无缝隙、各占一半（参考图实测） */
.cp-tabs {
  display: flex;
  height: 26px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--cp-slot);
}
.cp-tab {
  flex: 1;
  font: inherit;
  font-size: 12px;
  color: var(--text);
  background: none;
  border: 0;
  cursor: pointer;
  text-shadow: 0 1px 0 #00000066;
}
.cp-tab:hover { color: #fff; }
.cp-tab.active { background: var(--cp-fill); color: #fff; }

/* 色轮 + 右侧明度竖条 */
.cp-wheel-row { display: flex; align-items: flex-start; }
.cp-wheel-wrap { position: relative; flex: none; }
.cp-wheel { display: block; border-radius: 50%; cursor: crosshair; touch-action: none; }

/* 游标：细圈（参考图直径≈轮径 8%、描边约 1.5px、无中心点），浅色 + 极淡暗描边保证亮底上也看得见 */
.cp-cursor {
  position: absolute;
  top: 0;
  left: 0;
  width: 13px;
  height: 13px;
  border: 1.5px solid #dcdcdc;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #00000045;
  pointer-events: none;
}

.cp-bar-wrap { position: relative; cursor: ns-resize; touch-action: none; }
.cp-bar { display: block; }
/*
 * 明度滑块：参考图实测是"悬出条宽"的浅色方块（内芯约 9px + 浅描边），
 * 上下各留 ~1.5px 深色分隔。用 box-shadow 画上下两条深色带，不需要额外 DOM。
 */
.cp-vknob {
  position: absolute;
  left: -2px;
  right: -2px;
  height: 10px;
  margin-top: -5px;
  background: #ffffff2e;
  border: 1px solid #e6e6e6;
  border-radius: 1px;
  box-shadow: 0 -2px 0 var(--cp-bg), 0 2px 0 var(--cp-bg);
  pointer-events: none;
}

/* Hex 行右侧的吸管按钮（参考图是 27×27 的 #545454 方块） */
.cp-icon-btn {
  width: 27px;
  height: 27px;
  flex: none;
  font: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--cp-slot);
  border: 0;
  border-radius: 3px;
  cursor: pointer;
}
.cp-icon-btn:hover { background: var(--cp-fill); color: #fff; }

/*
 * Alpha 行的滑条轨道：未填充槽用棋盘格——本工具的 alpha 是"透明色"开关，
 * 0.000 时能一眼看出是透明；1.000 时填充全蓝，与参考图一致。
 */
.cp-alpha .cp-row-track {
  background: repeating-conic-gradient(#3a3d47 0 25%, #2c2f38 0 50%) 0 0 / 8px 8px;
}

/*
 * 数值行 = **[滑条轨道][数值框]**，数值框在轨道之外（结构隔离，见 colorpicker.ts 注释）。
 * 行底色用面板色：轨道才是"滑条"，右边那块是放数字的地方。
 * 行高 27px、上下各留 1px，于是相邻两条轨道之间有 2px 深色分隔（不需要分隔线）。
 */
.cp-fields { display: flex; flex-direction: column; }
.cp-row {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 27px;
  padding: 1px 0;
  background: var(--cp-bg);
}
/* 轨道：拖动命中区 + 填充的裁剪容器。拖动基准是轨道本身，填充画在轨道里。
   touch-action:none 才有触摸拖动；cursor 只在轨道上给 ew-resize（数值框上是文本光标） */
.cp-row-track {
  position: relative;
  flex: 1;
  min-width: 0;
  align-self: stretch;
  border-radius: 2px;
  overflow: hidden;
  background: var(--cp-slot);
  cursor: ew-resize;
  touch-action: none;
}
/* 蓝色填充层：宽度 = 数值占满量的比例（0.800 → 80%），由 paintFields() 写入 */
.cp-row-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0;
  background: var(--cp-fill);
}
/* 标签浮在填充层之上；pointer-events:none 让指针事件的 target 就是轨道本身 */
.cp-row-label {
  position: relative;
  display: block;
  padding-left: 8px;
  line-height: 25px;
  font-size: 12px;
  color: var(--text);
  text-shadow: 0 1px 0 #00000066;
  pointer-events: none;
}
/* 数值输入：必须盖掉全局 input 样式（271 行那条 input[type="text"] 选择器特异性比单个类高，
   所以这里写成 .cp-row .cp-num） */
.cp-row .cp-num,
.cp-hexrow .cp-num {
  font: inherit;
  font-family: var(--font);
  font-size: 12px;
  color: var(--text);
  background: none;
  border: 0;
  border-radius: 0;
  outline: none;
  /* 取色器整体禁选（见 .cp），但输入框必须能选中自己的内容，否则没法拖选替换 */
  user-select: text;
}
.cp-row .cp-num {
  flex: none;
  width: 42px;
  padding: 0 3px 0 0;
  text-align: right;
  cursor: text;
}
.cp-row .cp-num:focus,
.cp-hexrow .cp-num:focus { color: #fff; }

/* Hex 行（常驻）：灰标签 + 深色输入框 + 吸管按钮 */
.cp-hexrow { display: flex; align-items: center; gap: 6px; }
.cp-hex-label { font-size: 12px; color: var(--dim); }
.cp-hexrow .cp-num {
  flex: 1;
  width: auto;
  min-width: 0;
  height: 27px;
  padding: 0 8px;
  text-align: left;
  font-family: var(--mono);
  background: var(--cp-field);
  border: 1px solid var(--line);
  border-radius: 3px;
}

/* 色板 */
.cp-swatches { display: flex; flex-direction: column; gap: 5px; }
.cp-swatch-row { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.cp-swatch-name { width: 34px; flex: none; font-size: 10px; color: var(--dim); }
.cp-swatch {
  width: 16px;
  height: 16px;
  padding: 0;
  border: 1px solid #00000066;
  border-radius: 3px;
  cursor: pointer;
}
.cp-swatch:hover { outline: 2px solid var(--accent); outline-offset: -1px; }
.cp-swatch.transparent {
  width: 24px;
  background: repeating-conic-gradient(#3a3d47 0 25%, #2c2f38 0 50%) 0 0 / 8px 8px;
  color: #d8dbe4;
  font-size: 11px;
  line-height: 14px;
}
.cp-swatch.transparent.active { outline: 2px solid var(--accent); outline-offset: -1px; }

.cp-foot { display: flex; justify-content: flex-end; }

/* ------------------------------------------------------------------ 提示与模态 */

.toast-stack {
  position: fixed;
  right: 14px;
  bottom: 34px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 90;
}
.toast {
  padding: 7px 11px;
  border-radius: var(--radius);
  background: #262b36;
  border: 1px solid var(--line);
  box-shadow: 0 4px 16px #0008;
  max-width: 340px;
  font-size: 12px;
}
.toast.warn { border-color: var(--warn); }
.toast.error { border-color: var(--error); }

.modal-mask {
  position: fixed;
  inset: 0;
  background: #00000099;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 120;
}
.modal {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  max-width: 620px;
  max-height: 80vh;
  overflow: auto;
  box-shadow: 0 12px 40px #000a;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
.modal table { border-collapse: collapse; width: 100%; }
.modal td { padding: 3px 8px 3px 0; vertical-align: top; }
.modal td:first-child { font-family: var(--mono); color: var(--accent); white-space: nowrap; }
.modal td:last-child { color: var(--text); }

/* ------------------------------------------------------------------ 响应式 */

@media (max-width: 1200px) {
  .main { grid-template-columns: 200px 1fr 260px; }
  /* 保证右上角的动作按钮不与左侧模式切换抢空间：编辑类按钮先收成图标 */
  .act .act-label { display: none; }
  .act { padding: 5px 8px; }
}
@media (max-width: 980px) {
  .main { grid-template-columns: 1fr; }
  /*
   * 窄屏：侧栏收成抽屉。
   * 必须**有开关**——早先只写了 display:none 却没有展开机制，于是窄窗口下
   * 工具与参数面板完全不可达（测试报告 P2-06）。开关是顶栏两个 `.narrow-only` 按钮，
   * 展开态由 `body.drawer-open` 驱动。
   */
  .rail, .right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: min(300px, 88vw);
    z-index: 80;
    box-shadow: 0 0 32px #000a;
    display: none;
  }
  .rail { left: 0; }
  .right { right: 0; }
  body.drawer-open .rail, body.drawer-open .right { display: block; }
  /* 抽屉打开时用遮罩挡住画布，点遮罩关闭——避免"看起来还能点画布" */
  body.drawer-open .drawer-scrim { display: block; }
}

/* 窄屏抽屉遮罩（桌面宽度下不产生可见效果） */
.drawer-scrim {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: #00000066;
  display: none;
}
.drawer-scrim[hidden] { display: none; }
@media (max-width: 720px) {
  .header { padding: 6px 8px; gap: 6px; }
  .header-left { gap: 6px; }
  .logo { font-size: 12px; }
  .mode-select { padding: 4px 6px; }
  .header-actions { gap: 4px; }
  .dropdown { min-width: 240px; right: -4px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <!--
      顶栏分两组：
        左侧 = 品牌 + 模式切换（工作模式的锚点，位置固定不动）
        右侧 = 其余全部操作：撤销 / 重做 / 重新转换 / 新建 / 导入 / 导出，最右侧是「? 快捷键」
      依据是桌面软件的肌肉记忆：动作按钮集中在右上角，左侧只放"当前处于什么状态"；
      帮助类入口放在最边缘（离其它按钮远一点，避免误触）。
      窄屏（≤980px）时侧栏被收成抽屉，因此最左边会出现「工具」「参数」两个开关按钮。
    -->
    <div class="header-left">
      <div class="logo">▦ 像素画工作台</div>
      <div class="header-mode" id="header-mode"></div>
    </div>
    <div class="header-right">
      <button class="btn narrow-only" id="btn-drawer-tools" type="button"></button>
      <button class="btn narrow-only" id="btn-drawer-panel" type="button"></button>
      <div class="header-actions" id="header-actions"></div>
      <button class="btn" id="btn-import" type="button"></button>
      <div class="menu-anchor" id="export-anchor">
        <button class="btn primary" id="btn-export" type="button" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="dropdown" id="export-menu" role="menu" hidden></div>
      </div>
      <button class="btn act edge" id="btn-help" type="button"></button>
    </div>
  </header>

  <div class="main">
    <aside class="rail" id="rail-left">
      <div id="rail-tools"></div>
      <div class="panel" id="panel-palette"></div>
    </aside>

    <section class="center">
      <div class="canvas-host" id="canvas-host">
        <canvas id="board"></canvas>
        <!--
          空状态提示**不写死在模板里**：它由 UI 在"没有画布"时才插入、一旦有画布就移除。
          写死会导致它一直盖在画好的画布上——表现为"导入图片没反应"（曾真实发生）。
        -->
        <div class="magnifier" id="magnifier">
          <canvas id="magnifier-canvas" width="116" height="116"></canvas>
          <div class="mag-label">原图对照</div>
        </div>
        <div class="view-toolbar" role="group" aria-label="视图操作">
          <button class="btn tiny" id="view-fit" title="适配窗口（0）">适配</button>
          <button class="btn tiny" id="view-100" title="1 格 = 1 像素">100%</button>
          <button class="btn tiny" id="view-out" aria-label="缩小">−</button>
          <button class="btn tiny" id="view-in" aria-label="放大">＋</button>
        </div>
      </div>
      <footer class="statusbar" id="statusbar"></footer>
    </section>

    <aside class="right" id="rail-right">
      <div class="panel" id="panel-params"></div>
    </aside>
  </div>
  <!-- 窄屏抽屉遮罩：点它关闭抽屉（桌面宽度下不显示） -->
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
</div>
